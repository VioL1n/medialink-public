[project]
name = "medialink"
version = "0.1.0"
description = "Personal media search and 115 library ingestion"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "httpx[socks]>=0.28", "telethon>=1.40,<2", "p115client>=0.0.9", "jieba>=0.42", "beautifulsoup4>=4.13", "python-socks[asyncio]>=2.7", "cryptography>=44", "libtorrent==2.1.1"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11", "playwright>=1.55,<2"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
